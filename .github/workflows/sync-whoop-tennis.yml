name: Sync WHOOP Tennis Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch WHOOP data and write data.json
        id: fetch
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: |
          node - <<'EOF'
          const https = require('https');
          const fs = require('fs');

          const CLIENT_ID     = process.env.WHOOP_CLIENT_ID;
          const CLIENT_SECRET = process.env.WHOOP_CLIENT_SECRET;

          // Read refresh token from repo file instead of secret
          let REFRESH_TOKEN = '';
          try {
            REFRESH_TOKEN = fs.readFileSync('whoop_token.txt', 'utf8').trim();
          } catch(e) {
            console.error('Could not read whoop_token.txt — file missing from repo.');
            process.exit(1);
          }

          const TENNIS_SPORT_ID = 34;

          function post(url, params) {
            return new Promise((resolve, reject) => {
              const body = new URLSearchParams(params).toString();
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, port: 443, path: u.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Content-Length': Buffer.byteLength(body),
                  'Accept': 'application/json'
                }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  console.log('POST status:', res.statusCode);
                  try { resolve({ status: res.statusCode, data: JSON.parse(data) }); }
                  catch(e) { reject(new Error('JSON parse error: ' + data)); }
                });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          function get(url, token) {
            return new Promise((resolve, reject) => {
              const u = new URL(url);
              const req = https.request({
                hostname: u.hostname, port: 443,
                path: u.pathname + u.search, method: 'GET',
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
              }, res => {
                let data = '';
                res.on('data', c => data += c);
                res.on('end', () => {
                  try { resolve({ status: res.statusCode, data: JSON.parse(data) }); }
                  catch(e) { reject(new Error('JSON parse error: ' + data)); }
                });
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function run() {
            console.log('Refreshing WHOOP access token...');
            console.log('Token preview:', REFRESH_TOKEN.substring(0,20) + '...' + REFRESH_TOKEN.slice(-4));
            console.log('Client ID preview:', CLIENT_ID ? CLIENT_ID.substring(0,10) + '...' : 'MISSING');
            console.log('Client Secret present:', CLIENT_SECRET ? 'YES (' + CLIENT_SECRET.length + ' chars)' : 'MISSING');

            const tokenResp = await post('https://api.prod.whoop.com/oauth/oauth2/token', {
              grant_type: 'refresh_token',
              refresh_token: REFRESH_TOKEN,
              client_id: CLIENT_ID,
              client_secret: CLIENT_SECRET,
              redirect_uri: 'https://oauth.pstmn.io/v1/browser-callback',
              scope: 'read:workout read:cycles read:recovery offline'
            });

            if (tokenResp.status !== 200) {
              console.error('Token refresh failed:', JSON.stringify(tokenResp.data));
              process.exit(1);
            }

            const accessToken = tokenResp.data.access_token;
            const newRefreshToken = tokenResp.data.refresh_token;
            console.log('Token refreshed successfully.');
            console.log('New token preview:', newRefreshToken.substring(0,20) + '...' + newRefreshToken.slice(-4));

            // Write new refresh token back to repo file
            fs.writeFileSync('whoop_token.txt', newRefreshToken + '\n');
            console.log('New refresh token written to whoop_token.txt');

            console.log('Fetching tennis workouts (sport_id=' + TENNIS_SPORT_ID + ')...');
            const cutoff = new Date('2026-01-01T00:00:00Z');
            let allWorkouts = [];
            let nextToken = null;
            let pages = 0;

            do {
              let url = 'https://api.prod.whoop.com/developer/v2/activity/workout?limit=25';
              if (nextToken) url += '&nextToken=' + encodeURIComponent(nextToken);

              const resp = await get(url, accessToken);
              if (resp.status !== 200) {
                console.error('Workout fetch failed:', JSON.stringify(resp.data));
                process.exit(1);
              }

              const records = resp.data.records || [];
              const tennis = records.filter(w => {
                if (w.sport_id !== TENNIS_SPORT_ID) return false;
                return new Date(w.start || w.created_at || '') >= cutoff;
              });
              allWorkouts = allWorkouts.concat(tennis);
              nextToken = resp.data.next_token || null;
              pages++;

              const oldest = records[records.length - 1];
              if (oldest && new Date(oldest.start || oldest.created_at || '') < cutoff) break;
              if (pages > 20) break;
            } while (nextToken);

            console.log('Found ' + allWorkouts.length + ' tennis sessions from 2026+');

            console.log('Fetching recovery scores...');
            const recoveryMap = {};
            let recNextToken = null;
            let recPages = 0;
            do {
              let recUrl = 'https://api.prod.whoop.com/developer/v2/recovery?limit=25';
              if (recNextToken) recUrl += '&nextToken=' + encodeURIComponent(recNextToken);
              const recResp = await get(recUrl, accessToken);
              console.log('Recovery page ' + (recPages+1) + ' status:', recResp.status);
              if (recResp.status !== 200) {
                console.log('Recovery fetch failed:', JSON.stringify(recResp.data).substring(0,200));
                break;
              }
              const recRecords = recResp.data.records || [];
              console.log('Recovery records on page:', recRecords.length);
              if (recRecords.length > 0) console.log('Sample record keys:', Object.keys(recRecords[0]).join(', '));
              if (recPages === 0 && recRecords.length > 0) {
                console.log('Sample recovery record:', JSON.stringify(recRecords[0]).substring(0, 400));
              }
              recRecords.forEach(r => {
                const dateRaw = r.updated_at || r.created_at || '';
                if (!dateRaw) return;
                const d = new Date(dateRaw);
                if (d < cutoff) return;
                const dateStr = d.toISOString().split('T')[0];
                const score = r.score && r.score.recovery_score !== undefined ? r.score.recovery_score : null;
                if (score !== null) {
                  recoveryMap[dateStr] = Math.round(score);
                }
              });
              recNextToken = recResp.data.next_token || null;
              recPages++;
              const oldest = recRecords[recRecords.length - 1];
              if (oldest) {
                const oldestDate = new Date(oldest.created_at || oldest.start || '');
                if (oldestDate < cutoff) break;
              }
              if (recPages > 20) break;
            } while (recNextToken);

            console.log('Recovery scores fetched for ' + Object.keys(recoveryMap).length + ' days.');
            const sampleRecoveryDates = Object.keys(recoveryMap).sort().slice(-5);
            console.log('Sample recovery dates (latest 5):', sampleRecoveryDates.join(', '));

            const sessions = allWorkouts.map(w => {
              const d = new Date(w.start || w.created_at);
              const dateStr = d.toISOString().split('T')[0];
              const strain = w.score && w.score.strain ? Math.round(w.score.strain * 10) / 10 : 0;
              let duration = null;
              if (w.end && w.start) {
                duration = Math.round((new Date(w.end) - new Date(w.start)) / 60000);
              }
              const recovery = recoveryMap[dateStr] || null;
              return {
                id: 'whoop-api-' + (w.id || w.workout_id),
                date: dateStr,
                strain,
                type: null,
                duration,
                recovery,
                source: 'whoop-api'
              };
            });

            const sampleSessionDates = sessions.slice(-5).map(s => s.date);
            console.log('Sample session dates (latest 5):', sampleSessionDates.join(', '));

            let existingData = { sessions: [], lastSync: null };
            try { existingData = JSON.parse(fs.readFileSync('data.json', 'utf8')); }
            catch(e) { console.log('No existing data.json — creating fresh.'); }

            let tags = {};
            try {
              tags = JSON.parse(fs.readFileSync('tags.json', 'utf8'));
              console.log('Found tags.json with ' + Object.keys(tags).length + ' tags.');
            } catch(e) { console.log('No tags.json found.'); }

            const existingMap = new Map((existingData.sessions || []).map(s => [s.id, s]));
            let added = 0, preserved = 0, updated = 0;
            sessions.forEach(s => {
              if (existingMap.has(s.id)) {
                const existing = existingMap.get(s.id);
                // FIX: Always refresh WHOOP-calculated fields so edits to
                // session start/end times in WHOOP reflect correctly.
                // Only 'type' (user-assigned tag) is preserved from existing data.
                const refreshed = {
                  ...existing,
                  strain: s.strain,
                  duration: s.duration,
                  recovery: s.recovery !== null && s.recovery !== undefined ? s.recovery : existing.recovery
                };
                // Track if anything actually changed
                if (refreshed.strain !== existing.strain ||
                    refreshed.duration !== existing.duration ||
                    refreshed.recovery !== existing.recovery) {
                  updated++;
                }
                existingMap.set(s.id, refreshed);
                preserved++;
              } else {
                existingMap.set(s.id, s);
                added++;
              }
            });

            const merged = Array.from(existingMap.values()).map(s => {
              if (tags[s.id]) return { ...s, type: tags[s.id] };
              return s;
            }).sort((a, b) => new Date(a.date) - new Date(b.date));

            fs.writeFileSync('data.json', JSON.stringify({
              sessions: merged,
              lastSync: new Date().toISOString(),
              syncStats: { added, preserved, updated, total: merged.length }
            }, null, 2));
            console.log('data.json written: ' + added + ' new, ' + preserved + ' preserved, ' + updated + ' updated, ' + merged.length + ' total.');

            if (Object.keys(tags).length > 0) {
              fs.writeFileSync('tags.json', JSON.stringify({}));
              console.log('tags.json reset after merge.');
            }
          }

          run().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Commit data.json and token to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json tags.json whoop_token.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: sync WHOOP tennis data $(date -u '+%Y-%m-%d')"
          git push
